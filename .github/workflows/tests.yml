name: QuantMind CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -r requirements-api.txt
      - run: python -m compileall -q app.py pages src scripts service_api.py
      - run: PYTHONPATH=src python -m pytest -q
